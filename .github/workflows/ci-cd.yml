# CI/CD Pipeline: Tests code quality and deploys to production if tests pass
# Runs on every push and PR to main
# Deploys on updates to main if tests pass

name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORT: 8000
      DATABASE_URL: postgresql://bookuser:bookpassword@localhost:5432/book_compass_test
      NODE_ENV: test
      JWT_SECRET: secret

    # Service containers to run with `test`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:14
        # Provide the password for postgres
        env:
          POSTGRES_USER: bookuser
          POSTGRES_PASSWORD: bookpassword
          POSTGRES_DB: book_compass_test
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Create schema
        # Runs a script that creates a PostgreSQL table, populates
        # the table with data, and then retrieves the data
        run: psql postgresql://bookuser:bookpassword@localhost:5432/book_compass_test -f db/schema.sql

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deployment triggered successfully"
